openapi: 3.1.0
info:
  title: Med Fusion OS API
  description: >
    API da Ordem de Serviço da Med Fusion Manutenção e Venda
    Clínica Hospitalar Ltda. Fecha a issue #21 (Definir contrato da API e
    versionamento /api/v1). Escopo e critérios de aceite em
    https://github.com/celsojuniorsfs/medfusion-os-web/blob/main/docs/escopo-v1.md.
    Convenções (autenticação, formato de erro) detalhadas em ./api-conventions.md.

    Atualizado em 07/09/2026 (duas rodadas de validação com o cliente): equipamentos sem limite
    por OS (catálogo reaproveitável por cliente), peça com valor opcional + labor_cost, status
    ampliado (OrderStatus, com not_approved distinto de canceled) e notificação automática por
    e-mail/WhatsApp na criação da OS.

    Atualizado em 08/09/2026: nomes de campo (schemas) padronizados em inglês — só os valores de
    negócio em português (nomes de cliente, defeitos descritos etc.) continuam em português,
    como dados, não como nomes de campo.

    Atualizado em 08/09/2026 (arquitetura): identificadores (`id` e os parâmetros de rota
    correspondentes) passaram de inteiro sequencial para UUID — identidade dos agregados do
    Event Sourcing (ver architecture.md). `number` da OS não muda: continua o número de negócio
    sequencial (seed 1336), editável pelo técnico, sem relação com a identidade do agregado.
  version: "2.0.0"
  license:
    name: Proprietary
    identifier: proprietary
servers:
  - url: http://localhost:8000/api/v1
    description: Local
  - url: https://medfusion-os-api.laravel.cloud/api/v1
    description: Produção (Laravel Cloud) — domínio final definido na F6, ver ambientes.md

tags:
  - name: auth
    description: Autenticação de técnicos via Laravel Sanctum
  - name: clients
    description: Cadastro de clientes
  - name: equipments
    description: Catálogo de equipamentos por cliente, reaproveitável entre OS's
  - name: accessories
    description: >
      Catálogo global de acessórios (api#92) — cadastrado uma vez, reaproveitado por equipamentos
      de qualquer cliente
  - name: equipment-models
    description: >
      Catálogo global de modelos de equipamento (api#101) — cadastrado uma vez, reaproveitado por
      qualquer cliente
  - name: orders
    description: Ordens de Serviço
  - name: alerts
    description: >
      Alertas operacionais (api#136) — só administrative/general_admin. Revisão anual por
      equipamento é o primeiro tipo; outros tipos (hoje só por e-mail) entram numa issue futura.

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Autentica um técnico e emite um token de acesso
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    {
                      type: string,
                      description: "Sanctum personal access token",
                    }
                  user: { $ref: "#/components/schemas/User" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoga o token de acesso corrente
      operationId: logoutUser
      responses:
        "204": { description: Sessão encerrada }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [auth]
      summary: Retorna o usuário autenticado
      operationId: getCurrentUser
      responses:
        "200":
          description: Usuário autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /clients:
    get:
      tags: [clients]
      summary: Lista clientes com busca e paginação, ordenados por cadastro mais recente primeiro
      operationId: listClients
      parameters:
        - name: search
          in: query
          description: Busca por nome/razão social (name), nome fantasia (trade_name) ou CPF/CNPJ (tax_id)
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Página de clientes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Client" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [clients]
      summary: Cria um cliente
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: Cliente criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Client" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /clients/{id}:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      tags: [clients]
      summary: Exibe um cliente
      operationId: getClient
      responses:
        "200":
          description: Cliente encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Client" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [clients]
      summary: Atualiza um cliente
      operationId: updateClient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "200":
          description: Cliente atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Client" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [clients]
      summary: Remove um cliente
      operationId: deleteClient
      responses:
        "204": { description: Removido }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cep/{cep}:
    get:
      tags: [clients]
      summary: Consulta um CEP (proxy cacheado do ViaCEP), usado pra preencher o endereço automaticamente no cadastro de cliente
      operationId: getCep
      parameters:
        - name: cep
          in: path
          required: true
          description: 8 dígitos, com ou sem pontuação
          schema: { type: string, example: "15775000" }
      responses:
        "200":
          description: >
            Endereço encontrado, ou `{ "erro": true }` quando o ViaCEP não reconhece o CEP —
            mesmo shape que o ViaCEP devolve, sem reformatação.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cep" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /clients/{id}/equipments:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      tags: [equipments]
      summary: Lista os equipamentos cadastrados para o cliente
      operationId: listClientEquipments
      responses:
        "200":
          description: Lista de equipamentos do cliente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Equipment" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [equipments]
      summary: Cadastra um equipamento novo para o cliente
      description: >
        Também é chamado implicitamente por POST /orders quando uma OS traz um equipamento
        digitado pela primeira vez — o equipamento fica salvo no catálogo do cliente para as
        próximas OS's.
      operationId: createClientEquipment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipmentInput" }
      responses:
        "201":
          description: Equipamento cadastrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Equipment" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /clients/{id}/equipments/{equipmentId}:
    parameters:
      - $ref: "#/components/parameters/ClientId"
      - $ref: "#/components/parameters/EquipmentId"
    put:
      tags: [equipments]
      summary: Atualiza um equipamento do catálogo do cliente
      operationId: updateClientEquipment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipmentInput" }
      responses:
        "200":
          description: Equipamento atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Equipment" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [equipments]
      summary: Remove um equipamento do catálogo do cliente
      operationId: deleteClientEquipment
      description: >
        Remove também as fotos do equipamento — as linhas por cascade no banco, e os arquivos no
        Object Storage por um Reactor (api#102).
      responses:
        "204": { description: Removido }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /equipments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: uuid do equipamento (não do cliente)
    get:
      tags: [equipments]
      summary: Busca um equipamento só pelo id, sem precisar saber o cliente
      description: >
        Fora do prefixo /clients/{clientId} de propósito: existe para o fluxo de reconhecimento de
        equipamento por QR Code, onde quem chega aqui só tem o uuid do equipamento (lido da
        etiqueta), não o client_id. O Equipment já traz client_id no payload.
      operationId: getEquipment
      responses:
        "200":
          description: Equipamento encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Equipment" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /clients/{id}/equipments/{equipmentId}/photos:
    parameters:
      - $ref: "#/components/parameters/ClientId"
      - $ref: "#/components/parameters/EquipmentId"
    get:
      tags: [equipments]
      summary: Lista as fotos do equipamento
      description: >
        Endpoint próprio, fora de GET /clients/{id}/equipments de propósito (api#102): a listagem de
        equipamentos é cacheada, e a `url` de cada foto é assinada com validade curta — congelá-la
        no cache entregaria link vencido. Aqui nada é cacheado e a URL é sempre nova.
      operationId: listEquipmentPhotos
      responses:
        "200":
          description: Fotos do equipamento, da mais antiga para a mais recente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EquipmentPhoto" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [equipments]
      summary: Envia uma foto do equipamento
      description: >
        multipart/form-data, campo `photo`. Aceita jpeg/png/webp até 8 MB. HEIC (padrão do iPhone)
        ainda não é aceito — converter exigiria imagick no runtime (ressalva registrada em api#102).
      operationId: uploadEquipmentPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        "201":
          description: Foto enviada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EquipmentPhoto" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /clients/{id}/equipments/{equipmentId}/photos/{photoId}:
    parameters:
      - $ref: "#/components/parameters/ClientId"
      - $ref: "#/components/parameters/EquipmentId"
      - name: photoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [equipments]
      summary: Remove uma foto do equipamento
      description: >
        Apaga a linha e o arquivo no Object Storage. Uma foto de outro equipamento devolve 404, não
        403 — mesma decisão do PUT de equipamento.
      operationId: deleteEquipmentPhoto
      responses:
        "204": { description: Removida }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /equipment-photos/{photoId}:
    parameters:
      - name: photoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [equipments]
      summary: Serve o arquivo da foto (URL assinada)
      description: >
        **Única rota do projeto fora do `auth:sanctum`.** Uma tag `<img>` não manda header
        Authorization, então a credencial é a assinatura da própria URL, com validade de 30 minutos
        — é exatamente a `url` que EquipmentPhoto devolve, e não deve ser montada à mão. Sem
        assinatura válida, 403.
      operationId: showEquipmentPhoto
      security: []
      responses:
        "200":
          description: O arquivo da imagem
          content:
            image/*:
              schema: { type: string, format: binary }
        "403": { description: Assinatura ausente, inválida ou expirada }
        "404":
          $ref: "#/components/responses/NotFound"

  /accessories:
    get:
      tags: [accessories]
      summary: Lista o catálogo global de acessórios, ordenado por nome
      description: >
        Sem paginação nem busca no servidor (mesma decisão já tomada pro catálogo de
        equipamentos do cliente): a lista inteira volta de uma vez, busca é filtro client-side
        no seletor do front.
      operationId: listAccessories
      responses:
        "200":
          description: Lista de acessórios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Accessory" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [accessories]
      summary: Cadastra um acessório novo no catálogo global
      description: >
        Também é chamado implicitamente por POST/PUT nos equipamentos quando um acessório é
        digitado pela primeira vez — fica salvo no catálogo global para os próximos
        equipamentos (api#92).
      operationId: createAccessory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessoryInput" }
      responses:
        "201":
          description: Acessório cadastrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Accessory" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /equipment-models:
    get:
      tags: [equipment-models]
      summary: Lista o catálogo global de modelos de equipamento, ordenado por nome
      description: >
        Sem paginação nem busca no servidor (mesma decisão do catálogo de acessórios): a lista
        inteira volta de uma vez, busca é filtro client-side no seletor do front.
      operationId: listEquipmentModels
      responses:
        "200":
          description: Lista de modelos de equipamento
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EquipmentModel" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [equipment-models]
      summary: Cadastra um modelo novo no catálogo global
      description: >
        Também é chamado implicitamente por POST/PUT nos equipamentos quando o técnico digita um
        modelo que ainda não existe no catálogo — fica salvo para os próximos cadastros (api#101).
      operationId: createEquipmentModel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipmentModelInput" }
      responses:
        "201":
          description: Modelo cadastrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EquipmentModel" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /accessories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [accessories]
      summary: Corrige o nome de um acessório do catálogo
      description: >
        O nome corrigido aparece automaticamente em todo equipamento que usa o acessório — ele nunca
        foi copiado, `equipment_accessories` guarda só o id (api#109).
      operationId: updateAccessory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessoryInput" }
      responses:
        "200":
          description: Acessório atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Accessory" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [accessories]
      summary: Remove um acessório do catálogo
      description: >
        Recusado com 409 quando algum equipamento usa este acessório.
      operationId: deleteAccessory
      responses:
        "204": { description: Removido }
        "409":
          description: Acessório em uso por equipamentos cadastrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /equipment-models/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [equipment-models]
      summary: Corrige uma entrada do catálogo de modelos
      description: >
        Corrigir aqui **também corrige os equipamentos** que apontam para esta entrada (o nome/marca/
        modelo que cada um guarda como cópia). OS já emitidas não mudam: guardam o snapshot do que
        foi atendido na época (ver api-conventions.md § Snapshot do equipamento na OS).
      operationId: updateEquipmentModel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipmentModelInput" }
      responses:
        "200":
          description: Modelo atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EquipmentModel" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [equipment-models]
      summary: Remove uma entrada do catálogo de modelos
      description: >
        Recusado com 409 quando algum equipamento usa este modelo — a entrada do catálogo sobrevive
        de propósito à remoção de uma unidade física, então só sai quando ninguém mais aponta pra ela.
      operationId: deleteEquipmentModel
      responses:
        "204": { description: Removido }
        "409":
          description: Modelo em uso por equipamentos cadastrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders:
    get:
      tags: [orders]
      summary: Lista OS com filtros, ordenadas por status (cancelada por último) e depois data decrescente
      operationId: listOrders
      parameters:
        - name: client_id
          in: query
          schema: { type: string, format: uuid }
        - name: equipment_id
          in: query
          description: >
            Filtra as OS's de um equipamento específico do catálogo. Usado pela tela de
            histórico do equipamento (ver escopo-v1.md § Histórico do equipamento) — geralmente
            combinado com client_id.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Página de OS
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Order" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [orders]
      summary: Cria uma OS com equipamentos e peças aninhados
      description: >
        Equipamentos informados sem equipment_id são cadastrados no catálogo do cliente nesta
        mesma chamada (ver OrderEquipmentInput). O PDF não é gerado automaticamente — o técnico
        solicita via POST /orders/{id}/pdf (ver abaixo). A geração automática + notificação por
        e-mail/WhatsApp na criação chega com o api#70, que ainda depende da verificação da conta
        Meta do cliente.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: OS criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Número de OS já utilizado por outra ordem de serviço
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/next-number:
    get:
      tags: [orders]
      summary: Sugere o próximo número de OS (último número emitido + 1, seed 1336)
      operationId: getNextOrderNumber
      responses:
        "200":
          description: Próximo número sugerido
          content:
            application/json:
              schema:
                type: object
                properties:
                  number: { type: integer, example: 1337 }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{id}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [orders]
      summary: Exibe uma OS
      operationId: getOrder
      responses:
        "200":
          description: OS encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [orders]
      summary: Atualiza uma OS (substitui equipamentos e peças)
      operationId: updateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "200":
          description: OS atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: >
            Duas causas possíveis, distinguidas só pela mensagem (mesmo schema Error nas duas):
            número de OS já utilizado por outra ordem de serviço, ou a OS está com um status que
            não aceita mais edição (canceled/completed/not_approved — ver
            OrderService::assertIsEditable, api-conventions.md § Status da OS).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{id}/status:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    patch:
      tags: [orders]
      summary: Transiciona o status da OS
      operationId: updateOrderStatus
      description: >
        Ver OrderStatus. Transições: open→in_analysis→external_quote (opcional)
        →awaiting_approval→approved→completed. canceled é alcançável a partir de qualquer
        estado anterior a approved. not_approved só a partir de awaiting_approval.
        warranty_repair só a partir de completed (retrabalho dentro do prazo, mesma OS), e de
        warranty_repair de volta para completed. Tabela completa em api-conventions.md.
        partially_completed (api#140) nunca é alcançável por aqui — 422, mesma resposta de uma
        transição fora da tabela — e completed é recusado (422) enquanto sobrar equipamento não
        resolvido (ver PATCH /orders/{id}/equipments/situation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/OrderStatus" }
      responses:
        "200":
          description: Status atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "422":
          description: >
            Transição de status inválida, incluindo uma tentativa manual de ir pra
            partially_completed ou de completar a OS com equipamento pendente (api#140).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorBody" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{id}/equipments/situation:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    patch:
      tags: [orders]
      summary: Muda a situação técnica de um ou mais equipamentos da OS
      operationId: updateOrderEquipmentsSituation
      description: >
        api#140 — situação por equipamento (order_equipments), independente do status da OS. Um
        id só ou vários de uma vez (marcação em lote, pra OS's com muitos equipamentos). Sem
        máquina de estados: qualquer situação pode ir pra qualquer outra. Quando o status da OS já
        depende dos equipamentos (approved/partially_completed/warranty_repair), o status é
        recalculado sozinho depois desta chamada (ver OrderStatus.description).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_equipment_ids, situation]
              properties:
                order_equipment_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                  description: id(s) de order_equipments — precisam pertencer a esta OS.
                situation: { $ref: "#/components/schemas/OrderEquipmentSituation" }
      responses:
        "200":
          description: Situação atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "409":
          description: A OS está com um status que não aceita mais edição (canceled/completed/not_approved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: order_equipment_ids inválido ou não pertence a esta OS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorBody" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{id}/equipments/approval:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    patch:
      tags: [orders]
      summary: Aprova ou reprova o orçamento de um ou mais equipamentos da OS
      operationId: updateOrderEquipmentsApproval
      description: >
        api#149 — status do orçamento por equipamento (order_equipments), independente da
        situação técnica. Só aceita ids que já têm um orçamento gerado (ver
        POST /orders/{id}/pdf) — approval_status ainda null é rejeitado. A OS deriva pra
        `approved` sozinha quando o primeiro equipamento é aprovado, se o status atual já for
        `awaiting_approval` (ver OrderStatus.description); reprovar um equipamento não muda o
        status da OS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_equipment_ids, approval_status]
              properties:
                order_equipment_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                  description: id(s) de order_equipments com orçamento já gerado.
                approval_status: { $ref: "#/components/schemas/OrderEquipmentApprovalStatus" }
      responses:
        "200":
          description: Aprovação atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "409":
          description: A OS está com um status que não aceita mais edição (canceled/completed/not_approved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: order_equipment_ids inválido, não pertence a esta OS, ou ainda sem orçamento gerado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorBody" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{id}/pdf:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [orders]
      summary: Gera o orçamento (PDF) da OS e o envia ao Object Storage
      description: >
        api#149 — `order_equipment_ids` opcional: ausente gera o orçamento da OS inteira
        (comportamento original); presente, gera um orçamento parcial só com os equipamentos
        listados (mais os itens gerais, sem vínculo com nenhum equipamento). Cada chamada grava
        um arquivo novo SEM apagar os anteriores — todos ficam no histórico
        (GET /orders/{id}/pdf/history). `orders.pdf_path`/GET /orders/{id}/pdf continuam
        apontando pro mais recente. Um equipamento incluído que ainda não tinha orçamento nenhum
        (approval_status null) passa a `awaiting_approval`.
      operationId: generateOrderPdf
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                order_equipment_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                  description: ausente/null = todos os equipamentos da OS.
      responses:
        "200":
          description: PDF gerado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPdf" }
        "422":
          description: order_equipment_ids inválido ou não pertence a esta OS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorBody" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [orders]
      summary: Retorna a URL assinada do último PDF gerado
      operationId: getOrderPdf
      responses:
        "200":
          description: PDF disponível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPdf" }
        "404":
          description: OS não encontrada, ou PDF ainda não foi gerado para esta OS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{id}/pdf/history:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [orders]
      summary: Lista todos os orçamentos já gerados pra esta OS
      description: >
        api#149 — mais recente primeiro. Cada entrada guarda um snapshot dos equipamentos
        incluídos NAQUELE momento (nome/posição), não uma referência viva a order_equipments —
        sobrevive a edições da OS depois. `url` é uma URL assinada própria de cada entrada,
        válida por 30 minutos.
      operationId: getOrderPdfHistory
      responses:
        "200":
          description: Histórico de orçamentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OrderPdfHistoryEntry" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{id}/pdf/download:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [orders]
      summary: Baixa o PDF mais recente da OS
      description: >
        Fora do auth:sanctum de propósito, mesmo padrão de GET /equipment-photos/{photoId}: a
        credencial é a assinatura da URL (query string `signature`/`expires`), com validade de 30
        minutos, gerada por OrderPdf.url. Nunca chamar esta rota direto sem antes passar por
        POST/GET /orders/{id}/pdf — a URL é sempre nova.
      operationId: downloadOrderPdf
      responses:
        "200":
          description: Arquivo PDF (application/pdf)
        "403":
          description: Assinatura ausente, inválida ou expirada
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{id}/pdf/{pdfId}/download:
    parameters:
      - $ref: "#/components/parameters/OrderId"
      - name: pdfId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [orders]
      summary: Baixa um orçamento específico do histórico (api#149)
      description: >
        Mesma credencial de /orders/{id}/pdf/download (assinatura da URL) — gerada pelo `url` de
        cada entrada de GET /orders/{id}/pdf/history, nunca chamada direto.
      operationId: downloadHistoricalOrderPdf
      responses:
        "200":
          description: Arquivo PDF (application/pdf)
        "403":
          description: Assinatura ausente, inválida ou expirada
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{id}/notify:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [orders]
      summary: Reenvia manualmente a notificação da OS (e-mail e WhatsApp)
      description: >
        Decidido na Fase 3 (Projeto) — completa o critério de aceite da issue api #65 ("existe
        uma forma de reenviar manualmente"). Usado quando o envio automático da criação falha.
        Reenvia o mesmo PDF já gerado (gera um se ainda não houver nenhum); não cria uma cópia
        nova. Processado de forma assíncrona pela fila `database` — por isso `202`, não `200`.
      operationId: resendOrderNotification
      responses:
        "202":
          description: Reenvio agendado
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /alerts/revisions:
    get:
      tags: [alerts]
      summary: Lista os alertas de revisão anual por equipamento pendentes de contato
      description: >
        api#136 — disparados (mês 6 ou 11 desde a última manutenção preventiva concluída) e ainda
        sem "cliente contatado". Provisório: uma issue futura substitui por um GET /alerts
        unificado, somando outros tipos de alerta hoje só por e-mail.
      operationId: listEquipmentRevisionAlerts
      responses:
        "200":
          description: Alertas pendentes de contato
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EquipmentRevisionAlert" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /alerts/revisions/{id}/contacted:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [alerts]
      summary: Marca "cliente contatado" num alerta de revisão
      description: >
        api#136 — mão única e idempotente: marcar de novo devolve 200 sem alterar
        client_contacted_at. Impede a cobrança de 7 dias pra este alerta.
      operationId: markEquipmentRevisionAlertContacted
      responses:
        "200":
          description: Alerta marcado (ou já estava)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EquipmentRevisionAlert" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token, emitido por POST /auth/login

  parameters:
    ClientId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EquipmentId:
      name: equipmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }

  responses:
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Usuário autenticado, mas sem o papel necessário (só administrative/general_admin)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Erro de validação
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationErrorBody" }

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ValidationErrorBody:
      type: object
      required: [message, errors]
      properties:
        message: { type: string, example: "The given data was invalid." }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          example:
            number: ["O número informado já está em uso."]

    Pagination:
      type: object
      properties:
        links:
          type: object
          properties:
            first: { type: string, format: uri }
            last: { type: string, format: uri }
            prev: { type: [string, "null"], format: uri }
            next: { type: [string, "null"], format: uri }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }

    User:
      type: object
      description: >
        role (api#133) é uma fatia mínima pro sistema de alertas mirar quem recebe cada aviso e
        liberar o liga/desliga só pro admin geral — não é o RBAC completo do futuro perfil
        Financeiro. Nenhum endpoint existente passa a checar isso.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role:
          {
            type: string,
            enum: [technician, administrative, general_admin],
            description: "Técnico (nunca recebe alerta), administrativo da assistência, ou administrador geral (único que liga/desliga notificação)",
          }

    Client:
      type: object
      description: >
        Nomes de campo em inglês (decidido em 08/09/2026); os valores em si continuam em
        português — são dados de negócio do cliente, não nomenclatura do sistema. A partir de
        10/09/2026 cobre pessoa física e jurídica explicitamente (ver person_type) — antes disso
        o cadastro só previa pessoa jurídica.
      properties:
        id: { type: string, format: uuid }
        person_type:
          {
            type: string,
            enum: [individual, company],
            description: "Pessoa física (individual) ou jurídica (company)",
          }
        name: { type: string, description: "Nome completo (pessoa física) ou razão social (pessoa jurídica)" }
        trade_name: { type: ["string", "null"], description: "Nome fantasia (só pessoa jurídica)" }
        tax_id:
          {
            type: string,
            description: "CPF (pessoa física, 11 dígitos) ou CNPJ (pessoa jurídica, 14 dígitos) — só números",
            example: "31233218000110",
          }
        state_registration: { type: ["string", "null"], description: "Inscrição estadual (só pessoa jurídica)" }
        requester: { type: ["string", "null"], description: "Solicitante" }
        department: { type: ["string", "null"], description: "Setor" }
        phone: { type: ["string", "null"], description: "Telefone" }
        email: { type: ["string", "null"], format: email, description: "E-mail" }
        address: { type: ["string", "null"], description: "Endereço" }
        city: { type: ["string", "null"], description: "Cidade" }
        state: { $ref: "#/components/schemas/BrazilianState" }
        postal_code: { type: ["string", "null"], description: "CEP, só números", example: "15775000" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BrazilianState:
      type: ["string", "null"]
      description: UF (sigla do estado)
      enum:
        [
          null, AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN,
          RS, RO, RR, SC, SP, SE, TO,
        ]

    ClientInput:
      type: object
      required: [person_type, name, tax_id, email, phone]
      properties:
        person_type: { type: string, enum: [individual, company] }
        name: { type: string }
        trade_name: { type: ["string", "null"] }
        tax_id: { type: string }
        state_registration: { type: ["string", "null"] }
        requester: { type: ["string", "null"] }
        department: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { $ref: "#/components/schemas/BrazilianState" }
        postal_code: { type: ["string", "null"] }

    Cep:
      type: object
      description: >
        Mesmo shape que o ViaCEP (https://viacep.com.br) devolve, repassado sem reformatação —
        ver CepController. `erro: true` é a forma do ViaCEP dizer "CEP não encontrado" (sem os
        demais campos).
      properties:
        cep: { type: string }
        logradouro: { type: string }
        complemento: { type: string }
        bairro: { type: string }
        localidade: { type: string }
        uf: { type: string }
        estado: { type: string }
        regiao: { type: string }
        ibge: { type: string }
        gia: { type: string }
        ddd: { type: string }
        siafi: { type: string }
        erro: { type: boolean }

    OrderStatus:
      type: string
      description: >
        Fechado nas duas rodadas de validação de 07/09/2026 (nomes de valor traduzidos para
        inglês em 08/09/2026 — o significado de negócio não mudou). Fluxo: open → in_analysis →
        external_quote (opcional) → awaiting_approval → approved → completed. canceled é
        alcançável a partir de qualquer estado anterior a approved. not_approved só a partir de
        awaiting_approval — orçamento sem retorno do cliente, mudança manual do técnico;
        distinto de canceled (que é uma decisão explícita do cliente ou da empresa).
        warranty_repair é uma reabertura especial, só a partir de completed (retrabalho dentro
        do prazo de garantia, mesma OS) — depois volta a completed. partially_completed (api#140)
        deriva sozinho da situação de cada equipamento (ver OrderEquipmentSnapshot.situation) —
        nunca alcançável por PATCH /orders/{id}/status manual, mesmo estando na tabela de
        transições. awaiting_approval → approved (api#149) tem os dois caminhos: manual (a OS
        inteira, como sempre foi) E automático, assim que o primeiro equipamento é aprovado (ver
        OrderEquipmentSnapshot.approval_status) — os dois convivem, um não bloqueia o outro. Ver
        api-conventions.md para a tabela completa e a correspondência com os termos em português
        usados com o cliente (aberta, em análise, orçamento externo, aguardando aprovação,
        aprovada, não aprovado, parcialmente concluída, garantia, concluída, cancelada).
      enum:
        - open
        - in_analysis
        - external_quote
        - awaiting_approval
        - approved
        - not_approved
        - partially_completed
        - warranty_repair
        - completed
        - canceled

    Equipment:
      type: object
      description: >
        Catálogo de equipamentos por cliente — cadastrado uma vez, reaproveitado entre OS's.
        Corrige a v1 original, que tratava equipamento como texto livre por OS sem limite de
        quantidade definido (a planilha só tinha espaço para 2; casos reais chegam a centenas).
        serial_number repetido no mesmo cliente não é bloqueado pela API (sem constraint
        unique) — o aviso ao técnico é responsabilidade do frontend, comparando contra a lista
        de equipamentos já carregada do cliente antes de enviar o cadastro.

        Atualizado em api#92: name/brand/model passam a ser obrigatórios (antes só name), e
        accessories deixa de ser texto livre — vira uma lista de itens do catálogo global de
        acessórios (Accessory), cada um com sua quantidade.
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        equipment_model_id:
          {
            type: ["string", "null"],
            format: uuid,
            description: "Entrada do catálogo global de modelos (api#101). Null só em equipamentos cadastrados antes do api#101 cujo nome/marca/modelo não casou com nenhuma entrada do catálogo — os três campos abaixo continuam preenchidos de qualquer forma",
          }
        name:
          {
            type: string,
            description: "Nome/tipo do equipamento, ex.: Bisturi. Cópia do catálogo (ver equipment_model_id) — ver api-conventions.md § Catálogo global de modelos de equipamento para por que a cópia existe",
          }
        brand:
          {
            type: ["string", "null"],
            description: "Marca — obrigatório em cadastros novos (ver EquipmentInput), mas equipamentos cadastrados antes do api#92 podem ter ficado sem",
          }
        model:
          { type: ["string", "null"], description: "Modelo — mesma ressalva de brand acima" }
        serial_number:
          { type: ["string", "null"], description: "Número de série" }
        asset_tag: { type: ["string", "null"], description: "Patrimônio" }
        accessories:
          type: array
          items: { $ref: "#/components/schemas/EquipmentAccessory" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EquipmentAccessory:
      type: object
      description: Um item do catálogo global de acessórios (Accessory), com a quantidade usada neste equipamento.
      properties:
        accessory_id: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }

    OrderEquipmentAccessory:
      type: object
      description: >
        Acessório digitado pra este equipamento nesta OS — snapshot livre, sem vínculo com o
        catálogo estruturado de acessórios (Accessory/EquipmentAccessory).
      required: [name, quantity]
      properties:
        name: { type: string, maxLength: 255 }
        quantity: { type: integer, minimum: 1 }

    EquipmentPhoto:
      type: object
      description: >
        Foto do equipamento (api#102) — pedido do cliente pra registrar como o aparelho chegou e não
        ter divergência na devolução. O arquivo mora no Object Storage; aqui vêm só os metadados e
        uma URL assinada temporária.
      properties:
        id: { type: string, format: uuid }
        equipment_id: { type: string, format: uuid }
        original_name:
          { type: string, description: "Nome do arquivo como veio do dispositivo" }
        mime_type: { type: string }
        size: { type: integer, description: "Bytes" }
        url:
          type: string
          format: uri
          description: >
            URL assinada, **válida por 30 minutos**, para GET /equipment-photos/{photoId}. Gerada a
            cada resposta — não guarde: use a que veio na última listagem e recarregue a lista
            quando expirar.
        created_at: { type: string, format: date-time }

    EquipmentInput:
      type: object
      required: [equipment_model_id, no_accessories]
      properties:
        equipment_model_id:
          type: string
          format: uuid
          description: >
            Entrada do catálogo global de modelos (ver EquipmentModel) — obrigatório desde o
            api#112. name/brand/model do equipamento vêm sempre da entrada escolhida, lidos no
            servidor; não é mais possível mandar texto livre aqui. Fecha a causa-raiz da issue
            #110: até o api#112, name/brand/model chegavam como texto e a API cadastrava uma
            entrada nova no catálogo sozinha quando não achava uma igual — erro de digitação e
            dado de teste entravam pra sempre sem ninguém pedir. Cadastrar um modelo novo agora só
            acontece em POST /equipment-models.
        serial_number: { type: ["string", "null"] }
        asset_tag: { type: ["string", "null"] }
        no_accessories:
          type: boolean
          description: >
            Marcação explícita de "sem acessórios" (api#92) — resolve a ambiguidade entre
            "esqueceram de preencher" e "realmente não tem nenhum". Obrigatório; quando `false`,
            `accessories` precisa ter ao menos 1 item.
        accessories:
          type: array
          description: >
            Cada item é `accessory_id` (reaproveita um acessório já cadastrado) OU `name`
            (cadastra um novo no catálogo global na hora) — mesmo padrão oneOf de
            OrderEquipmentInput.
          items:
            type: object
            required: [quantity]
            properties:
              accessory_id: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer, minimum: 1 }

    Accessory:
      type: object
      description: >
        Catálogo global de acessórios (api#92) — cadastrado uma vez, reaproveitado por
        equipamentos de qualquer cliente. Nome repetido não é bloqueado pela API (sem constraint
        unique), mesma decisão já tomada pro serial_number de Equipment — o seletor do frontend
        evita duplicata na prática oferecendo os itens já cadastrados antes de deixar digitar um
        novo.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: "Nome do acessório, ex.: Cabo de força" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AccessoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }

    EquipmentModel:
      type: object
      description: >
        Catálogo global de modelos de equipamento (api#101) — cadastrado uma vez, reaproveitado
        por qualquer cliente. Mesma ideia do catálogo de acessórios, agora pro próprio aparelho:
        "Ultrassom / Sonopus / XYZ-100" vira uma entrada só, e o cadastro da unidade física do
        cliente (Equipment) guarda o que é dela — número de série, patrimônio, acessórios.

        Repetido não é bloqueado pela API (sem constraint unique), mesma decisão já tomada pro
        nome de Accessory e pro serial_number de Equipment.
      properties:
        id: { type: string, format: uuid }
        name:
          { type: string, description: "Nome/tipo do aparelho, ex.: Ultrassom" }
        brand:
          {
            type: ["string", "null"],
            description: "Marca — obrigatória em cadastros novos (ver EquipmentModelInput); nullable porque o backfill cria entradas a partir de equipamentos antigos, que podem ter ficado sem",
          }
        model:
          { type: ["string", "null"], description: "Modelo — mesma ressalva de brand acima" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EquipmentModelInput:
      type: object
      required: [name, brand, model]
      properties:
        name: { type: string }
        brand: { type: string }
        model: { type: string }

    OrderEquipmentInput:
      description: >
        Referencia um equipamento já cadastrado (equipment_id) OU cadastra um novo pelo nome —
        `OrderRequest::rules()` expressa esse oneOf com `required_without` nas duas pontas, já que
        o Laravel não tem oneOf nativo.

        `accessories` aqui é uma LISTA de OrderEquipmentAccessory (`{name, quantity}`) e vale nos
        dois ramos — é o snapshot desta OS (`order_equipment_accessories`), sem vínculo com o
        catálogo estruturado de acessórios do equipamento (api#92). Até 26/09/2026 era texto livre
        (string, até 255 caracteres); um cliente antigo que ainda mandar string aqui é aceito por
        um shim transitório em `OrderRequest::prepareForValidation()` e convertido pra lista
        (dividida por vírgula/ponto-e-vírgula) antes da validação — não confiar nesse formato pra
        payloads novos, ele será removido depois que todos os clientes migrarem.

        Corrigido em 21/09/2026: o oneOf anterior referenciava `EquipmentInput` no segundo ramo,
        que desde o api#112 exige `equipment_model_id`/`no_accessories`/acessórios estruturados —
        um payload que `POST /orders` nunca aceitou. O contrato tinha ficado pra trás depois dessa
        mudança no catálogo.

        `preventive_maintenance`/`calibration` (api#146) valem nos dois ramos, pelo mesmo motivo
        de `accessories` — corrigido do nível de OS (api#134) pro de equipamento, porque nem todo
        equipamento tem calibração.

        `labor_cost`/`items` (api#149) também valem nos dois ramos — mão de obra e peças por
        equipamento, além dos campos gerais de mesmo nome no nível raiz de OrderInput (sem
        vínculo com nenhum equipamento).
      # Sem os `not`, um payload com equipment_id E name ao mesmo tempo batia nos dois ramos
      # (nenhum dos dois usa additionalProperties:false, então a chave do OUTRO ramo é só
      # "propriedade extra permitida") — um validador de contrato estrito rejeitava algo que a API
      # aceita de verdade (prioriza equipment_id, ignora o resto). O `not` força só um ramo bater
      # por vez.
      oneOf:
        - type: object
          required: [equipment_id]
          not: { required: [name] }
          properties:
            equipment_id: { type: string, format: uuid }
            preventive_maintenance: { type: boolean, default: false }
            calibration: { type: boolean, default: false }
            labor_cost: { type: ["number", "null"], format: float }
            accessories:
              type: array
              items: { $ref: "#/components/schemas/OrderEquipmentAccessory" }
            items:
              type: array
              items: { $ref: "#/components/schemas/OrderItem" }
        - type: object
          required: [name]
          not: { required: [equipment_id] }
          properties:
            name: { type: string, maxLength: 255 }
            brand: { type: ["string", "null"], maxLength: 255 }
            model: { type: ["string", "null"], maxLength: 255 }
            serial_number: { type: ["string", "null"], maxLength: 255 }
            asset_tag: { type: ["string", "null"], maxLength: 255 }
            preventive_maintenance: { type: boolean, default: false }
            calibration: { type: boolean, default: false }
            labor_cost: { type: ["number", "null"], format: float }
            accessories:
              type: array
              items: { $ref: "#/components/schemas/OrderEquipmentAccessory" }
            items:
              type: array
              items: { $ref: "#/components/schemas/OrderItem" }

    OrderEquipmentSituation:
      type: string
      description: >
        Situação técnica de UM equipamento dentro da OS (api#140), independente do status da OS
        — sem máquina de estados, qualquer uma pode ir pra qualquer outra. `completed` e
        `returned_unrepaired` são as "resolvidas": derivam o status da OS (ver
        OrderStatus.description) e param a contagem pro alerta por situação (api#147).
      enum:
        - in_analysis
        - awaiting_part
        - external_repair
        - completed
        - returned_unrepaired

    OrderEquipmentApprovalStatus:
      type: string
      description: >
        Status do orçamento de UM equipamento (api#149), independente de OrderEquipmentSituation.
        Sem coluna correspondente no payload de entrada — nasce `null` (nenhum orçamento gerado
        ainda) e vira `awaiting_approval` sozinho no primeiro POST /orders/{id}/pdf que inclui o
        equipamento; só depois disso PATCH /orders/{id}/equipments/approval aceita mudar pra
        `approved`/`not_approved`.
      enum:
        - awaiting_approval
        - approved
        - not_approved

    OrderEquipmentSnapshot:
      type: object
      description: >
        Decisão da Fase 2 (Análise): retrato do equipamento no momento em que esta OS foi criada
        — NÃO reflete edições feitas depois no catálogo (`equipments`). `equipment_id` aponta
        para o cadastro atual (usado para navegar até ele e para o filtro de histórico,
        `GET /orders?equipment_id=X`), mas os demais campos são a cópia congelada.
      required: [accessories]
      properties:
        id:
          {
            type: string,
            format: uuid,
            description: "id de order_equipments — usado em PATCH /orders/{id}/equipments/situation (api#140)",
          }
        equipment_id: { type: ["string", "null"], format: uuid }
        name: { type: string }
        brand: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        serial_number: { type: ["string", "null"] }
        asset_tag: { type: ["string", "null"] }
        preventive_maintenance:
          {
            type: boolean,
            description: "Alimenta a contagem de 12 meses até a próxima revisão (api#136)",
          }
        calibration:
          {
            type: boolean,
            description: "Manutenção distinta da preventiva, mas sem vencimento próprio: sempre sai na mesma data/mesma OS",
          }
        situation: { $ref: "#/components/schemas/OrderEquipmentSituation" }
        situation_changed_at:
          {
            type: string,
            format: date-time,
            description: "Última mudança de situação — alimenta o alerta por situação (api#147)",
          }
        completed_at:
          {
            type: ["string", "null"],
            format: date-time,
            description: "Preenchida só enquanto situation = completed; limpa se voltar a ficar pendente (ex.: reabertura em garantia). Base da contagem de 12 meses (api#136).",
          }
        position:
          {
            type: integer,
            description: "Ordem de chegada dentro da OS — vira a letra do certificado (api#61: 0 = A, 1 = B...)",
          }
        approval_status:
          {
            allOf: [{ $ref: "#/components/schemas/OrderEquipmentApprovalStatus" }],
            nullable: true,
            description: "null = nenhum orçamento gerado ainda pra este equipamento (api#149)",
          }
        approval_status_changed_at: { type: ["string", "null"], format: date-time }
        labor_cost:
          {
            type: ["number", "null"],
            format: float,
            description: "Mão de obra específica deste equipamento — convive com orders.labor_cost (geral)",
          }
        items:
          type: array
          description: Peças vinculadas a este equipamento — itens sem vínculo ficam em Order.items.
          items: { $ref: "#/components/schemas/OrderItem" }
        accessories:
          type: array
          description: Sempre presente, mesmo vazia ([]).
          items: { $ref: "#/components/schemas/OrderEquipmentAccessory" }

    OrderItem:
      type: object
      description: >
        unit_price é opcional — corrigido na validação de 07/09/2026. Orçamentos de prefeitura
        costumam trazer só o valor da mão de obra (orders.labor_cost), com o valor das peças
        embutido, para não ultrapassar o teto que dispara licitação.
      required: [quantity, description]
      properties:
        quantity: { type: number }
        description: { type: string }
        unit_price: { type: ["number", "null"], format: float }

    OrderPdf:
      type: object
      properties:
        url:
          {
            type: string,
            format: uri,
            description: "URL assinada da API (30 min), ver GET /orders/{id}/pdf/download",
          }
        generated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    OrderPdfHistoryEntry:
      type: object
      description: Uma entrada de GET /orders/{id}/pdf/history (api#149).
      properties:
        id: { type: string, format: uuid }
        generated_at: { type: string, format: date-time }
        equipments:
          type: array
          description: Snapshot (nome/posição) no momento da geração, não order_equipments ao vivo.
          items:
            type: object
            properties:
              equipment_id: { type: ["string", "null"], format: uuid }
              name: { type: string }
              position: { type: integer }
        url:
          {
            type: string,
            format: uri,
            description: "URL assinada própria desta entrada, ver GET /orders/{id}/pdf/{pdfId}/download",
          }
        expires_at: { type: string, format: date-time }

    EquipmentRevisionAlert:
      type: object
      description: >
        Alerta de revisão anual por equipamento (api#136). Mês 6 = acompanhamento, mês 11 =
        revisão (1 mês antes do vencimento de 12 meses) — contados da última manutenção
        preventiva concluída daquele equipamento, entre todas as OS's que ele já passou.
      properties:
        id: { type: string, format: uuid }
        milestone: { type: string, enum: [month_6, month_11] }
        due_date: { type: string, format: date-time }
        notified_at: { type: string, format: date-time }
        client_contacted_at: { type: ["string", "null"], format: date-time }
        billing_notified_at:
          {
            type: ["string", "null"],
            format: date-time,
            description: "Cobrança ao general_admin, 7 dias após notified_at sem contato",
          }
        equipment:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        order:
          type: object
          properties:
            id: { type: string, format: uuid }
            number: { type: integer }
            client_name: { type: ["string", "null"] }

    Order:
      type: object
      description: >
        Nomes de campo em inglês (decidido em 08/09/2026); os checkboxes de tipo de atendimento
        e os campos de texto continuam guardando dados em português — o formulário e o
        vocabulário de negócio com o cliente não mudam, só o nome técnico do campo.
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, example: 1336, description: "Número da OS" }
        date: { type: string, format: date }
        status: { $ref: "#/components/schemas/OrderStatus" }
        client: { $ref: "#/components/schemas/Client" }
        user: { $ref: "#/components/schemas/User" }
        picked_up: { type: boolean, description: "Retirado" }
        warranty:
          { type: boolean, description: "Garantia (tipo de atendimento)" }
        technical_training:
          { type: boolean, description: "Treinamento técnico" }
        on_site_quote: { type: boolean, description: "Orç. local" }
        rental: { type: boolean, description: "Locação" }
        reported_defect:
          { type: ["string", "null"], description: "Defeito apresentado" }
        maintenance_plan:
          { type: ["string", "null"], description: "Manutenção a aplicar" }
        notes: { type: ["string", "null"], description: "Observação" }
        payment_method:
          { type: ["string", "null"], description: "Forma de pagamento" }
        warranty_period:
          { type: ["string", "null"], description: "Garantia (prazo)" }
        proposal_validity:
          { type: ["string", "null"], description: "Validade da proposta" }
        labor_cost:
          {
            type: ["number", "null"],
            format: float,
            description: "Valor da mão de obra",
          }
        total: { type: number, format: float }
        certificate_number:
          { type: ["string", "null"], description: "Nº do certificado" }
        pdf_generated_at:
          {
            type: ["string", "null"],
            format: date-time,
            description: "Quando o PDF mais recente foi gerado (null se nunca foi). Ver GET /orders/{id}/pdf pra baixar",
          }
        equipments:
          type: array
          items: { $ref: "#/components/schemas/OrderEquipmentSnapshot" }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OrderInput:
      type: object
      description: >
        total não é enviado pelo cliente — é sempre calculado no backend a partir de labor_cost,
        items e, desde a api#149, dos labor_cost/items de cada equipamento também. Pelo menos um
        valor precisa estar presente em ALGUM desses lugares (ver critérios de aceite em
        escopo-v1.md).
      required: [number, date, client_id, equipments, items]
      properties:
        number: { type: integer }
        date: { type: string, format: date }
        client_id: { type: string, format: uuid }
        picked_up: { type: boolean, default: false }
        warranty: { type: boolean, default: false }
        technical_training: { type: boolean, default: false }
        on_site_quote: { type: boolean, default: false }
        rental: { type: boolean, default: false }
        reported_defect: { type: ["string", "null"] }
        maintenance_plan: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        payment_method: { type: ["string", "null"] }
        warranty_period: { type: ["string", "null"] }
        proposal_validity: { type: ["string", "null"] }
        labor_cost: { type: ["number", "null"], format: float }
        equipments:
          type: array
          minItems: 1
          description: Sem limite de quantidade — corrigido na validação de 07/09/2026.
          items: { $ref: "#/components/schemas/OrderEquipmentInput" }
        items:
          type: array
          description: Gerais, sem vínculo com nenhum equipamento (api#149) — os demais vão em equipments[].items.
          items: { $ref: "#/components/schemas/OrderItem" }
